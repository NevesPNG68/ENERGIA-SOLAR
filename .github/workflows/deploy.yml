name: Build compiled site for GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
      - 'assets/**'
      - '.nojekyll'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-compiled-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore Vite source index
        run: cp index.source.html index.html

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

      - name: Copy compiled site to repository root
        run: |
          rm -rf assets
          cp -R dist/assets ./assets
          cp dist/index.html ./index.html
          touch .nojekyll

      - name: Commit compiled site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets .nojekyll
          if git diff --cached --quiet; then
            echo "No compiled changes to publish"
          else
            git commit -m "Publica build compilado do app"
            git push origin main
          fi

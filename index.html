<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#050505" />
    <title>Comparativo Energia Solar × CDI</title>
    <style>
      html, body, #root { min-height: 100%; margin: 0; background: #050505; }
      #boot-status { color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 24px; }
    </style>
    <script>
      window.addEventListener('vite:preloadError', function (event) {
        event.preventDefault();
        var key = 'energia-solar-reload-once';
        if (!sessionStorage.getItem(key)) {
          sessionStorage.setItem(key, '1');
          location.reload();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"><div id="boot-status">Carregando comparativo...</div></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
